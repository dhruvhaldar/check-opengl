# Tests check_opengl.py on Linux in two scenarios:
#   headless-egl   -> no display at all; the pure-ctypes EGL backend must
#                     create a context via Mesa's software rasterizer
#                     (this is exactly the situation of a bare server)
#   desktop-glfw   -> virtual X server (Xvfb) + pip glfw; the GLFW backend
#                     must create a real desktop-style GL context
# The script's exit code is the test result:
#   0 = active (pass), 1 = installed but not active (fail), 2 = not found (fail)

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [headless-egl, desktop-glfw]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Mesa GL runtime and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libgl1-mesa-dri libegl-mesa0 libosmesa6 xvfb mesa-utils

      - name: Install glfw bindings (desktop scenario only)
        if: matrix.scenario == 'desktop-glfw'
        run: python -m pip install glfw

      - name: Run OpenGL check (headless, EGL path)
        if: matrix.scenario == 'headless-egl'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          EGL_PLATFORM: "surfaceless"
        run: python check_opengl.py

      - name: Run OpenGL check (desktop, GLFW path under Xvfb)
        if: matrix.scenario == 'desktop-glfw'
        run: xvfb-run -a python check_opengl.py

  windows:
    name: Windows (WGL)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run OpenGL check (pure-ctypes WGL)
        run: python check_opengl.py

      - name: Build standalone executable (PyInstaller)
        run: |
          python -m pip install pyinstaller
          pyinstaller --onefile --name check-opengl check_opengl.py

      - name: Code sign executable
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $exePath = "dist\check-opengl.exe"
          if (-not (Test-Path $exePath)) {
            throw "Executable not found at $exePath"
          }

          if ($env:WINDOWS_CERTIFICATE_BASE64 -and $env:WINDOWS_CERTIFICATE_PASSWORD) {
            Write-Host "Found certificate secrets. Decoding PFX..."
            $pfxPath = [System.IO.Path]::GetTempFileName() + ".pfx"
            try {
              $pfxBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
              [System.IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
              $securePwd = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
              $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\CurrentUser\My" -Password $securePwd
            } finally {
              if (Test-Path $pfxPath) { Remove-Item $pfxPath -Force }
            }
          } else {
            Write-Host "No certificate secrets configured. Generating self-signed certificate for signing..."
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=CheckOpenGL" -CertStoreLocation "Cert:\CurrentUser\My" -HashAlgorithm SHA256
          }

          $timestampServers = @(
            "http://timestamp.digicert.com",
            "http://timestamp.sectigo.com"
          )
          $signed = $false
          foreach ($ts in $timestampServers) {
            try {
              Write-Host "Signing executable using timestamp server: $ts"
              $sig = Set-AuthenticodeSignature -FilePath $exePath -Certificate $cert -TimestampServer $ts -HashAlgorithm SHA256 -ErrorAction Stop
              if ($sig.SignerCertificate -ne $null) {
                $signed = $true
                break
              }
            } catch {
              Write-Warning "Timestamp server $ts failed: $_"
            }
          }

          if (-not $signed) {
            Write-Host "Signing without timestamp server fallback..."
            $sig = Set-AuthenticodeSignature -FilePath $exePath -Certificate $cert -HashAlgorithm SHA256
          }

          $finalSig = Get-AuthenticodeSignature -FilePath $exePath
          Write-Host "Signature Subject: $($finalSig.SignerCertificate.Subject)"
          Write-Host "Signature Status: $($finalSig.Status)"
          if ($finalSig.SignerCertificate -eq $null) {
            throw "Code signing verification failed: executable has no valid signature."
          }

      - name: Test standalone executable
        run: .\dist\check-opengl.exe

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: check-opengl-windows-amd64
          path: dist/check-opengl.exe

  macos:
    name: macOS (CGL)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run OpenGL check (pure-ctypes CGL)
        run: python check_opengl.py

  release:
    name: Publish GitHub Release
    needs: [linux, windows, macos]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows executable artifact
        uses: actions/download-artifact@v4
        with:
          name: check-opengl-windows-amd64
          path: release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest Build' }}
          files: release-assets/check-opengl.exe
          generate_release_notes: true
          make_latest: "true"